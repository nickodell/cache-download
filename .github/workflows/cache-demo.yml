name: Cache Demo

on:
  push:
  workflow_dispatch:

jobs:
  cache-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Create files to cache
        run: |
          mkdir -p my-cached-dir
          echo "hello from file1" > my-cached-dir/file1.txt
          echo "hello from file2" > my-cached-dir/file2.txt
          date --iso-8601=seconds > my-cached-dir/timestamp.txt
          echo "Created files:"
          ls -la my-cached-dir/

      - name: Cache the directory
        id: cache
        uses: actions/cache@v4
        with:
          path: my-cached-dir
          key: demo-cache-${{ github.run_id }}-${{ github.run_attempt }}

      # The runner only injects ACTIONS_RUNTIME_TOKEN / ACTIONS_CACHE_URL into
      # JavaScript action processes, not into bash `run:` steps. We use
      # actions/github-script (a JS action) to read them.
      # The token is masked in every log encoding the runner detects, so we
      # write credentials to a file and upload as an artifact instead.
      - name: Write credentials to file
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const token      = process.env.ACTIONS_RUNTIME_TOKEN || '';
            const cacheUrl   = process.env.ACTIONS_CACHE_URL     || '';
            const resultsUrl = process.env.ACTIONS_RESULTS_URL   || '';

            core.info(`ACTIONS_CACHE_URL:   ${cacheUrl}`);
            core.info(`ACTIONS_RESULTS_URL: ${resultsUrl}`);

            fs.writeFileSync('/tmp/cache-creds.txt',
              `ACTIONS_CACHE_URL=${cacheUrl}\nACTIONS_RESULTS_URL=${resultsUrl}\nACTIONS_RUNTIME_TOKEN=${token}\n`
            );

      - name: Upload credentials artifact
        uses: actions/upload-artifact@v4
        with:
          name: cache-creds
          path: /tmp/cache-creds.txt

      - name: Show cache version
        run: |
          node -e "
          const crypto = require('crypto');

          // Replicates @actions/cache getCacheVersion() from cacheUtils.ts
          // version = SHA256([...paths, compressionMethod, '1.0'].join('|'))
          // On Linux the compression method is 'zstd' (falls back to 'zstd-without-long' or 'gzip').
          const paths = ['my-cached-dir'];
          const compressionMethod = 'zstd';
          const versionSalt = '1.0';

          const components = [...paths, compressionMethod, versionSalt];
          const joined = components.join('|');
          const version = crypto.createHash('sha256').update(joined).digest('hex');

          console.log('Paths:             ', paths);
          console.log('Compression method:', compressionMethod);
          console.log('Version salt:      ', versionSalt);
          console.log('Joined components: ', joined);
          console.log('Cache version:     ', version);
          "

      - name: Show cache key used
        run: |
          echo "Cache key: demo-cache-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "Cache hit: ${{ steps.cache.outputs.cache-hit }}"
