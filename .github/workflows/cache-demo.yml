name: Cache Demo

on:
  push:
  workflow_dispatch:

jobs:
  cache-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Create files to cache
        run: |
          mkdir -p my-cached-dir
          echo "hello from file1" > my-cached-dir/file1.txt
          echo "hello from file2" > my-cached-dir/file2.txt
          date --iso-8601=seconds > my-cached-dir/timestamp.txt
          echo "Created files:"
          ls -la my-cached-dir/

      # Fixed key so the cache persists across runs and can be looked up.
      - name: Cache the directory
        id: cache
        uses: actions/cache@v4
        with:
          path: my-cached-dir
          key: demo-cache-files

      - name: Show cache version
        run: |
          node -e "
          const crypto = require('crypto');
          // version = SHA256([...paths, compressionMethod, '1.0'].join('|'))
          const components = ['my-cached-dir', 'zstd', '1.0'];
          const version = crypto.createHash('sha256').update(components.join('|')).digest('hex');
          console.log('Cache key:    demo-cache-files');
          console.log('Cache version:', version);
          "

      # artifactcache.actions.githubusercontent.com is IP-restricted to GitHub's
      # runner network, so we call the internal lookup API from inside the workflow
      # and write the pre-signed archiveLocation blob URL to an artifact.
      # That URL is a plain Azure Blob Storage SAS URL accessible from anywhere.
      - name: Fetch cache archive URL
        uses: actions/github-script@v7
        with:
          script: |
            const crypto = require('crypto');
            const fs = require('fs');

            const token    = process.env.ACTIONS_RUNTIME_TOKEN || '';
            const cacheUrl = (process.env.ACTIONS_CACHE_URL || '').replace(/\/?$/, '/');

            core.info(`ACTIONS_CACHE_URL: ${cacheUrl}`);

            // Replicate getCacheVersion() from @actions/cache cacheUtils.ts
            const version = crypto.createHash('sha256')
              .update(['my-cached-dir', 'zstd', '1.0'].join('|'))
              .digest('hex');

            const key = 'demo-cache-files';
            const url = `${cacheUrl}_apis/artifactcache/cache?keys=${encodeURIComponent(key)}&version=${version}`;
            core.info(`Looking up: ${url}`);

            const resp = await fetch(url, {
              headers: {
                'Authorization': `Bearer ${token}`,
                'Accept': 'application/json;api-version=6.0-preview.1',
              },
            });

            core.info(`Status: ${resp.status}`);
            if (resp.status === 204) {
              core.info('Cache miss — archive not available yet (first run?)');
              return;
            }
            if (!resp.ok) {
              core.setFailed(`Cache lookup failed: ${resp.status} ${await resp.text()}`);
              return;
            }

            const entry = await resp.json();
            core.info(`Cache entry: ${JSON.stringify(entry, null, 2)}`);

            fs.writeFileSync('/tmp/archive-info.json', JSON.stringify({
              archiveLocation: entry.archiveLocation,
              cacheKey: entry.cacheKey,
              cacheVersion: entry.cacheVersion,
              version,
            }, null, 2));

      - name: Upload archive info artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive-info
          path: /tmp/archive-info.json
          if-no-files-found: warn
